<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Simclone · modular building visuals (DRAFT preview)</title>
<style>html,body{margin:0;background:#142b26}canvas{display:block}</style>
</head>
<body>
<canvas id="scene"></canvas>
<script type="module">
// Test scene only. Deterministic: no RNG and no clock reads. Query: ?zoom=1.25&dpr=2&grid=0
import {drawPiece,drawGhost,TILE,PALETTE} from './building-visuals.mjs';
import {buildScene} from './preview-scene.mjs';
import {BUILDING_ICON_D} from './building-icons.mjs';

const q=new URLSearchParams(location.search);
const ZOOM=Number(q.get('zoom')||1.25), DPR=Number(q.get('dpr')||2), GRID=q.get('grid')==='1';
const GRASS='#738f58';  // TERRAIN_COLORS.grass, src/worldsim-map.mjs L8
const {hw,hh}=TILE, proj=(x,y)=>({x:(x-y)*hw,y:(x+y)*hh});   // src/app.mjs L13-14
const BASE_H=880, CSS_W=Math.round(1000*ZOOM/1.25), CSS_H=Math.round(BASE_H*ZOOM/1.25);
const canvas=document.getElementById('scene'), ctx=canvas.getContext('2d');
canvas.style.width=CSS_W+'px';canvas.style.height=CSS_H+'px';canvas.width=CSS_W*DPR;canvas.height=CSS_H*DPR;

// same hash + tint as the game (app.mjs hash(), worldsim-map.mjs tint()) - deterministic
function hash(x,y){return ((Math.imul(x+33,374761393)^Math.imul(y+41,668265263))>>>0)/4294967296;}
function tint(hex,a){return '#'+[1,3,5].map(i=>Math.max(0,Math.min(255,parseInt(hex.slice(i,i+2),16)+a)).toString(16).padStart(2,'0')).join('');}
function poly(c,pts,fill,stroke,w=.7){c.beginPath();pts.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.closePath();if(fill){c.fillStyle=fill;c.fill();}if(stroke){c.strokeStyle=stroke;c.lineWidth=w;c.stroke();}}
function seg(c,pts,color,w=1){c.strokeStyle=color;c.lineWidth=w;c.beginPath();pts.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.stroke();}
function ell(c,x,y,rx,ry,color){c.fillStyle=color;c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);c.fill();}

const {ghosts,labels,drawList}=buildScene();   // canonical N/W sockets only, see preview-scene.mjs

// ---- minimal person (static copy of app.mjs person(), no animation) ------------------------
function person(c,a){const p=proj(a.x,a.y),ap={coat:'#5f7d8c',skin:'#d9a47d',hair:'#3b2a20'};c.save();c.translate(p.x,p.y);
 ell(c,1,2,10,4,'#19312755');seg(c,[[-3,-9],[-4,0]],'#344439',3);seg(c,[[3,-9],[4,0]],'#344439',3);
 poly(c,[[-6,-20],[5,-20],[7,-7],[-7,-7]],ap.coat);seg(c,[[-6,-18],[-9,-10]],ap.skin,3);seg(c,[[6,-18],[9,-10]],ap.skin,3);
 ell(c,0,-26,6.4,7.5,ap.skin);ell(c,0,-31,6.8,4.5,ap.hair);ell(c,-2,-26,1,.9,'#29392e');ell(c,3,-26,1,.9,'#29392e');c.restore();}

// ---- render ---------------------------------------------------------------------------------
ctx.setTransform(DPR,0,0,DPR,0,0);
ctx.fillStyle='#304b37';ctx.fillRect(0,0,CSS_W,CSS_H);
const origin={x:CSS_W/2,y:132*ZOOM/1.25};
ctx.save();ctx.translate(origin.x,origin.y);ctx.scale(ZOOM,ZOOM);
// ground: grass tiles, per-tile tint and tufts like makeGround()
for(let y=-30;y<=30;y++)for(let x=-30;x<=30;x++){const p=proj(x,y);if(Math.abs(p.x)>1000/1.25/2+40||p.y<-140||p.y>660)continue;
 poly(ctx,[[p.x,p.y-hh],[p.x+hw,p.y],[p.x,p.y+hh],[p.x-hw,p.y]],tint(GRASS,Math.round((hash(x+60,y+60)-.5)*12)));
 for(let k=0;k<4;k++){const dx=(hash(x+60+k*7,y+62)-.5)*32,dy=(hash(x+60,y+60+k*5)-.5)*12;seg(ctx,[[p.x+dx,p.y+dy],[p.x+dx-1,p.y+dy-3]],'#c0c88d66',.8);}}
if(GRID)for(let y=-30;y<=30;y++)for(let x=-30;x<=30;x++){const p=proj(x,y);poly(ctx,[[p.x,p.y-hh],[p.x+hw,p.y],[p.x,p.y+hh],[p.x-hw,p.y]],null,'#10241a55',.5);}
// objects sorted by depth exactly like app.mjs render() (built in preview-scene.mjs)
for(const o of drawList){
 if(o.kind==='agent'){person(ctx,o.data);continue;}
 const p=proj(o.info.x,o.info.y);ctx.save();ctx.translate(p.x,p.y);drawPiece(ctx,o.info.piece,o.info.edge,o.opts);ctx.restore();
}
// ghosts are drawn last, like the BUILD ghost in app.mjs L170
for(const g of ghosts){const p=proj(g.socket.x,g.socket.y);ctx.save();ctx.translate(p.x,p.y);drawGhost(ctx,g.piece,g.socket.type==='edge'?g.socket.side:null,g.ok);ctx.restore();}
// labels (game name-tag style)
ctx.font='9px system-ui';ctx.textAlign='center';
for(const l of labels){const w=ctx.measureText(l.text).width+12;ctx.fillStyle='#17352adc';ctx.beginPath();ctx.roundRect(l.p.x-w/2,l.p.y+l.dy-11,w,15,4);ctx.fill();ctx.fillStyle='#eee0b6';ctx.fillText(l.text,l.p.x,l.p.y+l.dy);}
ctx.restore();

// header + icon strip (screen space, CSS px * ZOOM/1.25 so the debug zoom scales too)
const k=ZOOM/1.25;ctx.save();ctx.scale(k,k);
ctx.fillStyle='#142b26e6';ctx.fillRect(0,0,1000,34);ctx.fillStyle='#e8cfa0';ctx.font='600 12px system-ui';ctx.textAlign='left';
ctx.fillText('SIMCLONE · MODULAR BUILDING VISUALS · DRAFT',16,21);ctx.fillStyle='#c0cbbf';ctx.font='11px system-ui';
ctx.fillText('zoom '+ZOOM+' · DPR '+DPR+' · ground '+GRASS+' · ghost ok '+PALETTE.ghost.valid.stroke+' / invalid '+PALETTE.ghost.invalid.stroke,330,21);
ctx.fillStyle='#142b26e6';ctx.fillRect(0,BASE_H-58,1000,58);
Object.entries(BUILDING_ICON_D).forEach(([name,ds],i)=>{const x=150+i*125,y=BASE_H-46;ctx.save();ctx.translate(x,y);
 ctx.strokeStyle='#e8cfa0';ctx.lineWidth=1.6;ctx.lineCap='round';ctx.lineJoin='round';for(const d of ds)ctx.stroke(new Path2D(d));ctx.restore();
 ctx.fillStyle='#c0cbbf';ctx.font='11px system-ui';ctx.textAlign='left';ctx.fillText(name,x+30,y+16);});
ctx.fillStyle='#c0cbbf';ctx.font='10px system-ui';ctx.fillText('icons 24×24',16,BASE_H-26);ctx.fillText('remove: not bound (P3)',870,BASE_H-12);
ctx.restore();
window.__png=canvas.toDataURL('image/png');window.__done=true;
</script>
</body>
</html>
