name: Verify Simclone candidates

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify engine, persistence and local assets
        run: npm test

      - name: Verify Survival Core regression suite
        run: npm run test:survival

      - name: Verify autonomous birth across seeds
        run: npm run test:lifecycle

      - name: Verify deterministic age death and cleanup
        run: npm run test:death

      - name: Setup Python for offline Chromium checks
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Verify observation UI offline
        run: python tests/ui-smoke.py

      - name: Verify navigation and save recovery offline
        run: python tests/navigation-smoke.py

      - name: Verify survival UI offline
        run: python tests/survival-smoke.py
