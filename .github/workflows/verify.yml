name: Verify Simclone candidates

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "ci/**"
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify engine, persistence and active unit regressions
        run: npm test

      - name: Setup Python for active Chromium UI smoke
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Verify active observation UI
        run: python tests/ui-smoke.py

      - name: Verify independent 120-year generation continuity
        run: node scripts/independent-world-proof.mjs 230926

      - name: Verify independent world offline UI
        run: python tests/independent-ui-smoke.py

      - name: Verify independent world native HTTP and storage
        run: python tests/independent-ui-smoke.py --native
