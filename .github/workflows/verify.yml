name: Verify Simclone candidates

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "ci/**"
      - "integration/**"
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify engine, persistence and active unit regressions
        run: npm test

      - name: Setup Python for active Chromium UI smoke
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify SWA7 public proof fixture and syntax
        run: |
          node scripts/swa7-public-fixture.mjs > /tmp/swa7-public-save.json
          python -m py_compile tests/public-swa7-smoke.py
          test -s /tmp/swa7-public-save.json

      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Verify RC4 Merchant Economy native desktop and mobile
        run: python tests/rc4-market-smoke.py

      - name: Upload RC4 Merchant Economy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc4-market-candidate-evidence-${{ github.sha }}
          path: evidence-ui/rc4-market-native/
          if-no-files-found: warn

      - name: Verify active observation UI
        run: python tests/ui-smoke.py

      - name: Verify autonomous Adventurer Hunt and Combat
        run: python tests/adventure-autonomy-smoke.py

      - name: Upload autonomous Adventure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-adventure-evidence-${{ github.sha }}
          path: evidence-ui/autonomous-adventure/
          if-no-files-found: warn

      - name: Verify Independent gameplay desktop smoke
        run: python tests/independent-ui-smoke.py --width 1440

      - name: Verify RC2 native crafting desktop and mobile
        run: python tests/rc2-crafting-smoke.py --native

      - name: Upload RC2 candidate browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc2-candidate-evidence-${{ github.sha }}
          path: evidence-ui/rc2-native/
          if-no-files-found: warn

      - name: Verify RC3.1 native physical Blueprint desktop and mobile
        run: python tests/blueprint-smoke.py --native

      - name: Upload RC3.1 candidate Blueprint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blueprint-candidate-evidence-${{ github.sha }}
          path: evidence-ui/blueprint-native/
          if-no-files-found: warn

      - name: Verify RC3.2 native Iron and Steel economy
        run: python tests/rc3-metal-smoke.py --native

      - name: Upload RC3.2 candidate metal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metal-candidate-evidence-${{ github.sha }}
          path: evidence-ui/metal-native/
          if-no-files-found: warn
