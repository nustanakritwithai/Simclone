name: Deploy Simclone to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify engine, persistence and local assets
        run: npm test

      - name: Verify survival across populations and food crises
        run: npm run test:survival

      - name: Verify autonomous birth across seeds
        run: npm run test:lifecycle

      - name: Verify deterministic age death and cleanup
        run: npm run test:death

      - name: Verify post-death generation continuity
        run: npm run test:continuity

      - name: Setup Python for offline Chromium checks
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Verify observation UI offline
        run: python tests/ui-smoke.py

      - name: Verify navigation and save recovery offline
        run: python tests/navigation-smoke.py

      - name: Verify survival UI offline
        run: python tests/survival-smoke.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
