name: Deploy Simclone to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify engine, persistence and local assets
        run: npm test

      - name: Verify survival across populations and food crises
        run: npm run test:survival

      - name: Verify autonomous birth across seeds
        run: npm run test:lifecycle

      - name: Verify deterministic age death and cleanup
        run: npm run test:death

      - name: Verify post-death generation continuity
        run: npm run test:continuity

      - name: Setup Python for offline Chromium checks
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Verify observation UI offline
        run: python tests/ui-smoke.py

      - name: Verify navigation and save recovery offline
        run: python tests/navigation-smoke.py

      - name: Verify survival UI offline
        run: python tests/survival-smoke.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public Pages release
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          page="${PAGE_URL%/}"
          code=""
          for attempt in $(seq 1 12); do
            code="$(curl --location --silent --show-error --output /tmp/live-index.html --write-out '%{http_code}' "${page}/?verify=${GITHUB_SHA}" || true)"
            if [ "$code" = "200" ]; then
              break
            fi
            echo "Attempt $attempt: public index returned ${code:-curl-error}"
            sleep 5
          done
          if [ "$code" != "200" ]; then
            echo "::error::Public Pages did not return HTTP 200 for ${GITHUB_SHA}"
            exit 1
          fi

          if ! cmp --silent index.html /tmp/live-index.html; then
            echo "::error::Public index.html does not match deployed release ${GITHUB_SHA}"
            diff -u index.html /tmp/live-index.html | head -200 || true
            exit 1
          fi

          python - <<'PY' > /tmp/runtime-pins.tsv
          import json
          import re
          from pathlib import Path

          text = Path("index.html").read_text(encoding="utf-8")
          match = re.search(r'<script type="importmap" id="runtime-import-map">(.*?)</script>', text, re.S)
          if not match:
              raise SystemExit("runtime import map not found")
          imports = json.loads(match.group(1))["imports"]
          for source, pinned in sorted(imports.items()):
              local_path = source.split("?", 1)[0].removeprefix("./")
              print(f"{local_path}\t{pinned}")
          PY

          while IFS=$'\t' read -r local_path pinned_path; do
            live_path="${pinned_path#./}"
            asset_url="${page}/${live_path}"
            asset_code="$(curl --location --silent --show-error --output /tmp/live-asset --write-out '%{http_code}' "$asset_url" || true)"
            if [ "$asset_code" != "200" ]; then
              echo "::error::Pinned runtime asset returned HTTP ${asset_code:-curl-error}: $pinned_path"
              exit 1
            fi
            if ! cmp --silent "$local_path" /tmp/live-asset; then
              echo "::error::Pinned runtime asset differs from source: $local_path"
              exit 1
            fi
          done < /tmp/runtime-pins.tsv

          echo "Public Pages HTTP 200 and all pinned runtime modules match ${GITHUB_SHA}"
