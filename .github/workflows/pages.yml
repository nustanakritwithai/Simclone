name: Deploy Simclone to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify engine, persistence and active unit regressions
        run: npm test

      - name: Setup Python for release browser smoke
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Verify active observation UI
        run: python tests/ui-smoke.py

      - name: Verify exact-main Independent native HTTP/storage
        run: python tests/independent-ui-smoke.py --native --width 1440

      - name: Verify RC2 exact-main native crafting
        run: python tests/rc2-crafting-smoke.py --native

      - name: Verify RC3.1 exact-main native physical Blueprint
        run: python tests/blueprint-smoke.py --native

      - name: Verify RC3.2 exact-main native Iron and Steel economy
        run: python tests/rc3-metal-smoke.py --native

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public Pages exact release
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          fetch_exact() {
            local path="$1" out="$2"
            curl --fail --silent --show-error --location \
              --retry 12 --retry-delay 5 --retry-all-errors \
              -H 'Cache-Control: no-cache' \
              "${base}/${path}?release=${RELEASE_SHA}" -o "$out"
          }
          fetch_exact "index.html" /tmp/public-index.html
          fetch_exact "src/app.mjs" /tmp/public-app.mjs
          fetch_exact "src/building-visuals.mjs" /tmp/public-building-visuals.mjs
          cmp --silent index.html /tmp/public-index.html
          cmp --silent src/app.mjs /tmp/public-app.mjs
          cmp --silent src/building-visuals.mjs /tmp/public-building-visuals.mjs
          echo "PASS public Pages: HTTP fetch and exact release bytes match ${RELEASE_SHA}"

      - name: Verify public Same-World Adventure lifecycle
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_SHA: ${{ github.sha }}
        run: python tests/public-swa7-smoke.py

      - name: Upload SWA7 public browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swa7-public-evidence-${{ github.sha }}
          path: evidence-public-swa7/
          if-no-files-found: warn


      - name: Verify public RC2 Crafter Identity lifecycle
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_SHA: ${{ github.sha }}
        run: python tests/rc2-crafting-smoke.py --public

      - name: Upload RC2 public browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc2-public-evidence-${{ github.sha }}
          path: |
            evidence-public-rc2/
            evidence-ui/rc2-native/
          if-no-files-found: warn

      - name: Verify public RC3.1 physical Blueprint lifecycle
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_SHA: ${{ github.sha }}
        run: python tests/blueprint-smoke.py --public

      - name: Upload RC3.1 public Blueprint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blueprint-public-evidence-${{ github.sha }}
          path: |
            evidence-public-blueprint/
            evidence-ui/blueprint-native/
          if-no-files-found: warn

      - name: Verify public RC3.2 Iron and Steel economy
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_SHA: ${{ github.sha }}
        run: python tests/rc3-metal-smoke.py --public

      - name: Upload RC3.2 public metal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metal-public-evidence-${{ github.sha }}
          path: |
            evidence-public-metal/
            evidence-ui/metal-native/
          if-no-files-found: warn
