name: Deploy Simclone to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify engine, persistence and active unit regressions
        run: npm test

      - name: Setup Python for active Chromium UI smoke
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Verify active observation UI
        run: python tests/ui-smoke.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public Pages exact release
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          fetch_exact() {
            local path="$1" out="$2"
            curl --fail --silent --show-error --location \
              --retry 12 --retry-delay 5 --retry-all-errors \
              -H 'Cache-Control: no-cache' \
              "${base}/${path}?release=${RELEASE_SHA}" -o "$out"
          }
          fetch_exact "index.html" /tmp/public-index.html
          fetch_exact "src/app.mjs" /tmp/public-app.mjs
          fetch_exact "src/building-visuals.mjs" /tmp/public-building-visuals.mjs
          cmp --silent index.html /tmp/public-index.html
          cmp --silent src/app.mjs /tmp/public-app.mjs
          cmp --silent src/building-visuals.mjs /tmp/public-building-visuals.mjs
          echo "PASS public Pages: HTTP fetch and exact release bytes match ${RELEASE_SHA}"
