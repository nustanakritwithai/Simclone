name: Apply reviewed RC4 repair once
on:
  push:
    branches: ['integration/rc4-merchant-economy-v1']
    paths: ['verification/rc4/_repair/**', '.github/workflows/rc4-apply-reviewed-repair.yml']
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'nustanakritwithai/Simclone' && github.ref == 'refs/heads/integration/rc4-merchant-economy-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Apply only the hash-locked reviewed repair
        run: python verification/rc4/_repair/apply.py
      - name: Run complete tests before publishing the repaired branch
        run: npm test
      - name: Publish to the same draft branch without force
        shell: bash
        run: |
          set -euo pipefail
          branch='integration/rc4-merchant-economy-v1'
          remote="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          test "$remote" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(rc4): apply verified release-boundary repairs and attacks'
          git push origin "HEAD:refs/heads/$branch"
          git show -s --format='Published %H tree %T' HEAD
