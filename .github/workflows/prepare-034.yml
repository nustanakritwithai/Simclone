name: Prepare scoped Simclone 0.3.4 repair
on:
  push:
    branches: ["maintenance/simclone-034-repair"]
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/maintenance/simclone-034-repair'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply source-only release repair
        run: node scripts/prepare-034.mjs
      - name: Verify unit and asset contracts
        run: |
          set -o pipefail
          npm test | tee /tmp/simclone-unit.log
      - name: Verify survival and lifecycle contracts
        run: |
          npm run test:survival
          npm run test:lifecycle
          npm run test:death
          npm run test:continuity
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install offline browser fixture
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify all observation and recovery fixtures
        run: |
          python tests/ui-smoke.py
          python tests/navigation-smoke.py
          python tests/survival-smoke.py
      - name: Record tested manifest and commit only to maintenance branch
        run: |
          test "$GITHUB_REF" = 'refs/heads/maintenance/simclone-034-repair'
          node scripts/record-034.mjs
          rm scripts/prepare-034.mjs scripts/record-034.mjs .github/workflows/prepare-034.yml
          git add src index.html tests scripts .github/workflows docs AGENTS.md README.md GAME_PLAN.md
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'fix(release): align 0.3.4 assets and prove saved generation continuity'
          git push origin HEAD:refs/heads/maintenance/simclone-034-repair
          git rev-parse HEAD
